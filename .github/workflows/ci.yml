# Integración continua de ConjuntoSmart.
# En cada push o pull request: análisis estático, pruebas con cobertura de las dos
# aplicaciones y, si todo pasa, se levanta el sistema completo con Docker y se
# ejecutan las pruebas funcionales de Postman contra la API real.
name: CI - Calidad ConjuntoSmart

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API Spring Boot (PMD, CPD, JUnit, JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residentes-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas, cobertura y análisis estático
        run: mvn -B verify pmd:check pmd:cpd-check
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-api-jacoco
          path: residentes-api/target/site/jacoco/

  web:
    name: Web Laravel (Pint, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test
      - name: Análisis estático (PHPStan + Larastan, nivel 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pruebas con cobertura (PHPUnit)
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit --coverage-text --coverage-html cobertura-web
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-web-phpunit
          path: admin-web/cobertura-web/

  integracion:
    name: Sistema completo en Docker + Postman
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
            - name: Crear .env con contraseñas aleatorias
        run: |
          {
            echo "RESIDENTES_DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "RESIDENTES_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "PROPIETARIOS_DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "PROPIETARIOS_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
          } > .env
      - name: Construir y levantar los contenedores
        run: docker compose up -d --build
      - name: Esperar a que la API y la web respondan
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8080/api/residentes > /dev/null \
              && curl -fs http://127.0.0.1:8000/login > /dev/null; then
              echo "Sistema listo"; exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Pruebas funcionales de la API (Postman + Newman)
        run: |
          docker run --rm --network conjuntosmart_default -v "$PWD/pruebas:/etc/newman" \
            postman/newman:6-alpine run postman/ConjuntoSmart-API.postman_collection.json \
            --env-var baseUrl=http://residentes-api:8080 --color on
      - name: Sin sesión, la web redirige al login
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/dashboard)
          echo "GET /dashboard sin sesión -> $codigo"
          test "$codigo" = "302"
      - name: Apagar
        if: always()
        run: docker compose down -v
