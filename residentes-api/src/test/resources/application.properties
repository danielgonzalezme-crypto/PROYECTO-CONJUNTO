spring.application.name=residentes-api
# Las pruebas usan H2 en memoria (en modo compatible con MySQL) en lugar de la base real.
spring.datasource.url=jdbc:h2:mem:residentes_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
